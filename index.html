<!doctype html>
<html lang="zh-CN" data-skin="cute">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记一笔</title>
<meta name="description" content="随手记账：分大类小类，按月按年汇总，数据只存在你的手机里。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="记一笔">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FDF9F3" media="(prefers-color-scheme: light)" id="themeLight">
<meta name="theme-color" content="#1F1A19" media="(prefers-color-scheme: dark)" id="themeDark">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- 小猪装饰：猪鼻子、蝴蝶结（蝴蝶结小猪）、领结（领结小猪）。颜色取自小猪形象，只在卡通外观里出现 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-snout" viewBox="0 0 24 18">
    <ellipse cx="12" cy="9" rx="10.8" ry="7.8" fill="#F7AFBF" stroke="#E07D96" stroke-width="1.4"/>
    <ellipse cx="8.4" cy="9.2" rx="1.9" ry="2.9" fill="#C45A78"/>
    <ellipse cx="15.6" cy="9.2" rx="1.9" ry="2.9" fill="#C45A78"/>
    <ellipse cx="9" cy="4.9" rx="3" ry="1.1" fill="#FFFFFF" opacity=".5"/>
  </symbol>
  <symbol id="i-bow" viewBox="0 0 32 22">
    <path d="M14.6 12.5 11.8 20.5M17.4 12.5 20.2 20.5" stroke="#D2AE6C" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M16 10.5C12.5 5 6 .8 3 3.2.8 5 1.2 13.2 4.6 15.8 7.6 18 12.8 14.2 16 10.5Z" fill="#F6E6C2" stroke="#D2AE6C" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M16 10.5C19.5 5 26 .8 29 3.2 31.2 5 30.8 13.2 27.4 15.8 24.4 18 19.2 14.2 16 10.5Z" fill="#F6E6C2" stroke="#D2AE6C" stroke-width="1.3" stroke-linejoin="round"/>
    <rect x="13.1" y="7" width="5.8" height="7" rx="2.5" fill="#EFD9A6" stroke="#D2AE6C" stroke-width="1.3"/>
  </symbol>
  <symbol id="i-tie" viewBox="0 0 32 20">
    <path d="M16 10 3.4 3.2C2 2.5 1 3.3 1 4.8v10.4c0 1.5 1 2.3 2.4 1.6Z" fill="#6B9BE0" stroke="#4172BA" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M16 10 28.6 3.2C30 2.5 31 3.3 31 4.8v10.4c0 1.5-1 2.3-2.4 1.6Z" fill="#6B9BE0" stroke="#4172BA" stroke-width="1.3" stroke-linejoin="round"/>
    <rect x="12.4" y="5.6" width="7.2" height="8.8" rx="2.6" fill="#5A8BD6" stroke="#4172BA" stroke-width="1.3"/>
  </symbol>
</svg>
<div class="app" id="app">
  <div class="shell">
    <div class="views">
      <section class="view" id="view-list" aria-label="明细">
        <header class="vhead" id="listHead"></header>
        <div id="listBody"></div>
      </section>
      <section class="view" id="view-stats" aria-label="汇总" hidden>
        <header class="vhead" id="statsHead"></header>
        <div id="statsBody"></div>
      </section>
    </div>
    <nav class="tabbar" aria-label="主导航">
      <button class="tab" type="button" data-act="tab" data-tab="list" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="3.5" width="15" height="17" rx="3"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg>
        <span>明细</span>
      </button>
      <button class="tab-add" type="button" data-act="add">
        <span class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <span>记一笔</span>
      </button>
      <button class="tab" type="button" data-act="tab" data-tab="stats" aria-current="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><rect x="5.5" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="5.5" width="3" height="11.5" rx="1"/><rect x="15.5" y="13.5" width="3" height="3.5" rx="1"/></svg>
        <span>汇总</span>
      </button>
    </nav>
  </div>

  <aside class="desk-qr" id="deskQr" hidden>
    <img class="dq-pig deco" src="img/pig-head.png" alt="" width="72" height="71">
    <p class="dq-title">用 iPhone 扫码安装</p>
    <img id="deskQrImg" src="qr.png" alt="记一笔网址的二维码" width="192" height="192">
    <p class="dq-sub">相机扫码，在 Safari 打开，点分享，选「添加到主屏幕」。</p>
    <p class="dq-url" id="deskUrl"></p>
  </aside>

  <div class="popover" id="monthPop" hidden></div>

  <div class="sheet" id="entrySheet" hidden>
    <div class="sheet-panel" id="entryPanel" role="dialog" aria-modal="true" aria-labelledby="entryTitle" tabindex="-1">
      <h2 class="sr-only" id="entryTitle">记一笔</h2>
      <header class="sheet-head">
        <button class="link" type="button" data-act="f-cancel">取消</button>
        <div class="seg" id="entryType" role="radiogroup" aria-label="收支">
          <button type="button" role="radio" data-act="f-type" data-v="out">支出</button>
          <button type="button" role="radio" data-act="f-type" data-v="in">收入</button>
        </div>
        <button class="link danger" type="button" id="entryDelete" data-act="f-del">删除</button>
      </header>
      <div class="entry-body">
        <div class="entry-cats" id="entryCats" role="group" aria-label="大类"></div>
        <div class="entry-subs" id="entrySubs" role="group" aria-label="小类"></div>
        <div class="entry-pad">
          <p class="entry-meta" id="entryMeta" hidden></p>
          <div class="entry-line">
            <input class="note" id="entryNote" type="text" placeholder="备注（可不填）" enterkeyhint="done" autocomplete="off" aria-label="备注">
            <div class="amount" id="entryAmount" aria-live="polite">
              <div class="expr num" id="entryExpr"></div>
              <div class="val zero" id="entryVal">0.00</div>
            </div>
          </div>
          <div class="keys" id="keys">
            <button class="key" type="button" data-k="7">7</button>
            <button class="key" type="button" data-k="8">8</button>
            <button class="key" type="button" data-k="9">9</button>
            <label class="key date"><span id="kDateLabel">今天</span><input type="date" id="entryDate" aria-label="日期"></label>
            <button class="key" type="button" data-k="4">4</button>
            <button class="key" type="button" data-k="5">5</button>
            <button class="key" type="button" data-k="6">6</button>
            <button class="key fn" type="button" data-k="+" aria-label="加">+</button>
            <button class="key" type="button" data-k="1">1</button>
            <button class="key" type="button" data-k="2">2</button>
            <button class="key" type="button" data-k="3">3</button>
            <button class="key fn" type="button" data-k="-" aria-label="减">−</button>
            <button class="key" type="button" data-k=".">.</button>
            <button class="key" type="button" data-k="0">0</button>
            <button class="key fn" type="button" data-k="del" aria-label="退格">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5.5h10.5A1.5 1.5 0 0 1 21 7v10a1.5 1.5 0 0 1-1.5 1.5H9L3.5 12z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>
            </button>
            <button class="key ok" type="button" data-k="ok" id="kOk">完成</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="sheet set-sheet" id="setSheet" hidden>
    <div class="sheet-panel" id="setPanel" role="dialog" aria-modal="true" aria-labelledby="setTitle" tabindex="-1">
      <header class="sheet-head">
        <button class="back" type="button" id="setBack" data-act="set-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
          <span>设置</span>
        </button>
        <h2 class="set-title" id="setTitle">设置</h2>
        <button class="link" type="button" data-act="set-close">完成</button>
      </header>
      <div class="set-body" id="setBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
